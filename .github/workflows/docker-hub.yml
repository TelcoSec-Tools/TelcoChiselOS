name: Publish to Docker Hub (TelcoSec)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag to publish (e.g. v1.0.0 or latest)'
        required: false
        default: 'latest'
      update_descriptions:
        description: 'Sync Markdown documentation to Docker Hub repository overview'
        type: boolean
        required: false
        default: true
  push:
    tags: ['v*.*.*']

concurrency:
  group: dockerhub-release
  cancel-in-progress: false

env:
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'telcosec' }}

jobs:
  # Base image must build and push first as add-ons inherit from it
  base:
    name: Build & Publish Base Image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Versioning
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.version_tag }}" ] && [ "${{ github.event.inputs.version_tag }}" != "latest" ]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          else
            VERSION="latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'telcosec' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push telcochisel-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base.Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/telcochisel-base:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/telcochisel-base:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=dockerhub-base
          cache-to: type=gha,mode=max,scope=dockerhub-base

      - name: Update Docker Hub Description for Base
        if: ${{ github.event.inputs.update_descriptions != 'false' }}
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'telcosec' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_NAMESPACE }}/telcochisel-base
          readme-filepath: docker/descriptions/base.md
          short-description: "TelcoSec TelcoChisel Base — Headless CLI telecom security penetration testing and research toolset"

  # Build downstream images in parallel
  add-ons:
    name: Build & Publish Add-ons
    needs: base
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sdr
            name: SDR Ecosystem
            short_desc: "TelcoSec TelcoChisel SDR — Software Defined Radio cellular research toolchain"
          - image: core-network
            name: Core Network (4G/5G SA)
            short_desc: "TelcoSec TelcoChisel Core Network — 4G/5G SA core & RAN emulation & exploitation"
          - image: device-tools
            name: Device Tools (Modem & Baseband)
            short_desc: "TelcoSec TelcoChisel Device Tools — Mobile device & baseband flashing & diagnostics"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Versioning
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.version_tag }}" ] && [ "${{ github.event.inputs.version_tag }}" != "latest" ]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          else
            VERSION="latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'telcosec' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push telcochisel-${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ env.DOCKERHUB_NAMESPACE }}/telcochisel-base:${{ steps.meta.outputs.version }}
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/telcochisel-${{ matrix.image }}:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/telcochisel-${{ matrix.image }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=dockerhub-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=dockerhub-${{ matrix.image }}

      - name: Update Docker Hub Description for ${{ matrix.image }}
        if: ${{ github.event.inputs.update_descriptions != 'false' }}
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'telcosec' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_NAMESPACE }}/telcochisel-${{ matrix.image }}
          readme-filepath: docker/descriptions/${{ matrix.image }}.md
          short-description: ${{ matrix.short_desc }}
