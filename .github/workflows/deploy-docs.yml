name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  SF_SSH_KEY: ${{ secrets.SF_SSH_KEY }}

# Runs on GitHub-hosted runners (ubuntu-latest).
# Uses Node 20 to build the static Nuxt 3 site and deploy to GitHub Pages and SourceForge.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --no-frozen-lockfile

      - name: Verify tool catalog parity
        run: node scripts/sync-catalogs.js

      - name: Generate static site
        working-directory: docs
        env:
          NODE_ENV: production
        run: pnpm run generate

      - name: Deploy to SourceForge Project Web
        if: env.SF_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SF_SSH_KEY" > ~/.ssh/sf_deploy
          chmod 600 ~/.ssh/sf_deploy
          ssh-keyscan -H web.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/sf_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new" \
            docs/.output/public/ \
            rfs85,telcochisel@web.sourceforge.net:/home/project-web/telcochisel/htdocs/
          echo "✓ Deployed to https://telcochisel.sourceforge.io"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/.output/public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
