name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# Runs on a self-hosted runner (any Linux host with Node 20+).
# Flip both `runs-on` values back to `ubuntu-latest` to return to
# GitHub-hosted runners. Requires the runner to have Node 20 available
# (actions/setup-node still installs/pins it if not).
jobs:
  build:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Verify tool catalog parity
        run: node scripts/sync-catalogs.js

      - name: Generate static site
        working-directory: docs
        env:
          NODE_ENV: production
        run: npm run generate

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/.output/public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, linux]
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
