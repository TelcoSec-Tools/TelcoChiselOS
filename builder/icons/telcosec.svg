<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffd5"/>
      <stop offset="100%" stop-color="#00bcd4"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#e8921e"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Protective Hexagon / Shield Backdrop -->
  <path d="M64 8 L114 26 L114 68 C114 96 90 118 64 124 C38 118 14 96 14 68 L14 26 Z" 
        fill="url(#shieldGrad)" stroke="url(#cyanNeon)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Inner Cyber Contour -->
  <path d="M64 18 L104 32 L104 66 C104 88 84 106 64 112 C44 106 24 88 24 66 L24 32 Z" 
        fill="none" stroke="#212d40" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Telecom RF Radar Broadcast Arcs -->
  <path d="M46 54 A22 22 0 0 1 82 54" fill="none" stroke="url(#cyanNeon)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M38 44 A32 32 0 0 1 90 44" fill="none" stroke="url(#cyanNeon)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M30 34 A42 42 0 0 1 98 34" fill="none" stroke="url(#cyanNeon)" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Central Transmitter Origin Dot -->
  <circle cx="64" cy="62" r="4.5" fill="url(#amberGlow)"/>

  <!-- Stylized Telecom Chisel / Probe Blade -->
  <path d="M44 94 L80 46 L88 52 L54 100 L40 102 Z" 
        fill="url(#amberGlow)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" filter="url(#neonGlow)"/>
  <path d="M40 102 L44 94 L54 100 Z" fill="#ffffff"/>
</svg>
