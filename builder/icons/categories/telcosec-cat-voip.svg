<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="grad-voip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#50fa7b"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="#181a1b" stroke="#30363d" stroke-width="2"/>
  <!-- VoIP Headset Band -->
  <path d="M14 24 A10 10 0 0 1 34 24" fill="none" stroke="#8b949e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left and Right Earpieces -->
  <rect x="11" y="21" width="5" height="10" rx="2" fill="url(#grad-voip)"/>
  <rect x="32" y="21" width="5" height="10" rx="2" fill="url(#grad-voip)"/>
  <!-- Microphone Boom -->
  <path d="M14 28 Q14 36, 22 36 L24 36" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round"/>
  <circle cx="26" cy="36" r="2.5" fill="#50fa7b"/>
  <!-- SIP Voice Waves -->
  <path d="M30 33 Q33 36, 30 39" fill="none" stroke="#50fa7b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M34 31 Q38 36, 34 41" fill="none" stroke="#50fa7b" stroke-width="1.8" stroke-linecap="round"/>
</svg>
