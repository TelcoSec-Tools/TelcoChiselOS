---
i18n:
  name: "Cleaning up live environment..."

dontChroot: false
timeout: 60
script:
  # 1. Remove casper live boot configuration & hooks from target
  - "-rm -f /etc/casper.conf"
  - "-rm -f /etc/initramfs-tools/conf.d/casper-boot"
  - "-rm -f /etc/initramfs-tools/hooks/blkid-for-casper"
  - "-rm -f /etc/initramfs-tools/hooks/overlay-for-casper"
  - "-rm -rf /etc/initramfs-tools/scripts/casper-premount"
  - "-rm -rf /etc/initramfs-tools/scripts/casper-bottom"
  
  # 2. Clean up live installer shortcuts & autostart hooks from skel and user homes
  - "-rm -f /etc/skel/Desktop/install-telcosec.desktop"
  - "-rm -f /etc/skel/.config/autostart/calamares-boot.desktop"
  - "-rm -f /root/Desktop/install-telcosec.desktop"
  - "-rm -f /usr/local/bin/install-telcosec /usr/local/bin/telcosec-install"
  - "-sh -c 'rm -f /home/*/Desktop/install-telcosec.desktop 2>/dev/null || true'"
  - "-sh -c 'rm -f /home/*/.config/autostart/calamares-boot.desktop 2>/dev/null || true'"
  
  # 3. Remove live session auto-login overrides and temporary sudoers
  - "-rm -f /etc/lightdm/lightdm.conf.d/50-telcosec-autologin.conf"
  - "-rm -f /etc/lightdm/lightdm.conf.d/autologin-telcosec.conf"
  - "-rm -f /etc/sudoers.d/99-casper"
  - "-rm -f /etc/polkit-1/localauthority/50-local.d/telcosec.pkla"
  
  # 4. Regenerate unique SSH host keys for installed system
  - "-sh -c 'ssh-keygen -A 2>/dev/null || true'"
