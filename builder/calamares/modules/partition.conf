# TelcoChiselOS Optimized Partition Configuration
---
# EFI system partition
efiSystemPartition:     "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: EFI

# Swap configuration
userSwapChoices:
    - none      # No swap
    - small     # Minimal swap for low-memory scenarios
    - suspend   # Swap sized identically to RAM for hibernation
    - file      # Swapfile instead of partition (highly recommended for SSDs)

# Encryption Settings
# Use LUKS2 for modern, strong cryptographic defaults
luksGeneration: luks2
enableLuksAutomatedPartitioning: true

# Filesystems
defaultFileSystemType:  "ext4"
availableFileSystemTypes:  ["ext4", "btrfs"]

# Always show partition labels in the manual partitioner
alwaysShowPartitionLabels: true

# Enable logical volume management support
lvm:
    enable: true
