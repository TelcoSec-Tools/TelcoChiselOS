# TelcoChisel GRUB Bootloader Configuration
# Sourced automatically by update-grub from /etc/default/grub.d/99-telcosec.cfg

# High-resolution display mode for crisp boot menu & seamless kernel transition
GRUB_GFXMODE="1920x1080,1280x720,auto"
GRUB_GFXPAYLOAD_LINUX="keep"

# Custom TelcoChisel GRUB 1920x1080 background splash
GRUB_BACKGROUND="/usr/share/backgrounds/telcosec/grub_background.png"

# Cyberpunk color theme (normal: light-gray text, highlight: neon cyan on black)
GRUB_COLOR_NORMAL="light-gray/black"
GRUB_COLOR_HIGHLIGHT="light-cyan/black"

